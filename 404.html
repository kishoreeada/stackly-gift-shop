<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="The requested page could not be found.">
<title>404 — Stackly | Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<style>
:root{--ink:#24131c;--wine:#72294b;--rose:#e8bfb4;--cream:#f7f0ea;--paper:#fffdf9;--muted:#75676e;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:var(--sans);background:var(--ink);color:#fff}
.error-page{height:100svh;min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden}
.error-page:before,.error-page:after{content:"";position:absolute;border:1px solid rgba(232,191,180,.13);border-radius:50%;pointer-events:none;z-index:-1}
.error-page:before{width:min(62vw,760px);height:min(62vw,760px);right:-18vw;top:-38vh}
.error-page:after{width:min(48vw,560px);height:min(48vw,560px);left:-20vw;bottom:-30vh}
.error-shell{width:min(1120px,calc(100% - 64px));height:min(760px,calc(100svh - 64px));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;position:relative}
.error-mark{width:72px;height:72px;border:1px solid rgba(232,191,180,.65);border-radius:50%;display:grid;place-items:center;color:var(--rose);font:500 36px var(--serif);margin-bottom:24px;box-shadow:0 0 0 12px rgba(232,191,180,.035)}
.error-kicker{margin:0 0 18px;color:var(--rose);font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.error-code{font:500 clamp(92px,15vw,190px)/.78 var(--serif);letter-spacing:-.08em;margin:0;color:#fff}
.error-title{font:500 clamp(38px,5vw,68px)/.92 var(--serif);letter-spacing:-.055em;margin:22px 0 18px}
.error-title em{color:var(--rose)}
.error-copy{max-width:620px;margin:0 auto;color:rgba(255,255,255,.7);font-size:17px;line-height:1.65}
.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:32px}
.error-action{min-height:54px;padding:0 23px;display:inline-flex;align-items:center;justify-content:center;gap:13px;border:1px solid transparent;text-decoration:none;font-size:15px;font-weight:700;cursor:pointer;transition:transform .35s ease,background .35s ease,color .35s ease,box-shadow .35s ease}
.error-home{background:#fff;color:var(--wine)}
.error-previous{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.error-action:hover{transform:translateY(-4px);box-shadow:0 16px 35px rgba(0,0,0,.18)}
.error-previous:hover{background:#fff;color:var(--wine)}
.error-action i{transition:transform .3s ease}.error-action:hover i{transform:translateX(4px)}
.error-note{margin:25px 0 0;color:rgba(255,255,255,.42);font-size:15px}
@media(max-width:767px){
  .error-shell{width:100%;height:100svh;padding:24px 20px}
  .error-mark{width:58px;height:58px;font-size:30px;margin-bottom:18px}
  .error-kicker{font-size:15px;letter-spacing:.14em;margin-bottom:14px}
  .error-code{font-size:clamp(82px,27vw,128px)}
  .error-title{font-size:clamp(34px,9vw,48px);margin:18px 0 14px}
  .error-copy{font-size:15px;line-height:1.55;max-width:520px}
  .error-actions{width:100%;margin-top:25px;flex-direction:column;gap:10px}
  .error-action{width:100%;min-height:52px}
  .error-note{font-size:15px;margin-top:18px}
}
@media(max-width:380px){
  .error-shell{padding-inline:16px}
  .error-code{font-size:82px}
  .error-title{font-size:34px}
  .error-copy{font-size:15px}
  .error-note{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body class="error-page">
<main class="error-shell">
  <div class="error-mark" data-aos="zoom-in" aria-hidden="true">L</div>
  <p class="error-kicker" data-aos="fade-up">404 · Page not found</p>
  <p class="error-code" data-aos="fade-up" data-aos-delay="60">404</p>
  <h1 class="error-title" data-aos="fade-up" data-aos-delay="110">This little corner<br><em>moved.</em></h1>
  <p class="error-copy" data-aos="fade-up" data-aos-delay="160">The destination is not part of this experience yet. Return to the previous page or head back to Stackly and keep exploring.</p>
  <div class="error-actions" data-aos="fade-up" data-aos-delay="220">
    <a class="error-action error-home" href="index.html">Back to Stackly <i class="fa-solid fa-arrow-right"></i></a>
    <button class="error-action error-previous" type="button" id="errorPrevious"><i class="fa-solid fa-arrow-left"></i> Back to previous page</button>
  </div>
  <p class="error-note">No header, sidebar or extra navigation — just a clear way out.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  if(window.AOS) AOS.init({duration:700,once:true,offset:20,easing:"ease-out-cubic",disable:()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches});
  if(window.gsap&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    gsap.fromTo(".error-shell",{opacity:0,y:18},{opacity:1,y:0,duration:.8,ease:"power3.out"});
    gsap.to(".error-mark",{rotation:360,duration:18,repeat:-1,ease:"none"});
  }
  document.getElementById("errorPrevious")?.addEventListener("click",()=>{
    if(window.history.length>1){window.history.back();}
    else{window.location.href="index.html";}
  });
});
</script>
</body>
</html>
